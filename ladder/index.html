<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ladders · Pickleball Wanderers</title>
<meta name="description" content="Group pickleball ladders run by Pickleball Wanderers: Elo ratings seeded from DUPR, fair teams and standings.">
<meta name="theme-color" content="#1d5c9e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1720" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/ladder/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/ladder/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column; each ladder is a row you tap through to */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --ink:#14212e; --muted:#5d6d7c; --line:#d6dee5;
  --court:#1d5c9e; --court-soft:#e3edf7;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Figtree",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--surface:#17222e;--ink:#e6edf3;--muted:#93a3b2;--line:#2a3846;--court:#6aa8e8;--court-soft:#1c2f44;color-scheme:dark}}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
.back{font-size:.88rem;color:var(--muted);text-decoration:none;align-self:flex-start}
.back:hover{color:var(--ink)}
h1{font:700 2.4rem/1 var(--display);margin:0;text-wrap:balance}
.lede{margin:6px 0 0;color:var(--muted);max-width:52ch}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.list li + li{border-top:1px solid var(--line)}
.list a{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 16px;color:inherit;text-decoration:none}
.list a:hover{background:var(--court-soft)}
.list a:focus-visible{outline:2px solid var(--court);outline-offset:-2px;border-radius:10px}
.name{font-weight:600;font-size:1.05rem;overflow-wrap:anywhere}
.meta{font-size:.82rem;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.go{font:600 .85rem var(--body);color:var(--court);white-space:nowrap}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:24px 16px;text-align:center;color:var(--muted)}
.note{font-size:.86rem;color:var(--muted);margin:0}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Pickleball Wanderers</a>
  <header>
    <h1>Ladders</h1>
    <p class="lede">Ratings for the groups we play with, starting from each player's DUPR. Pick your group to see the standings, make fair teams and record games.</p>
  </header>
  <ul class="list" id="list" hidden></ul>
  <div class="empty" id="empty">Loading ladders…</div>
  <p class="note">Recording games needs your group's PIN. Ask your organiser for it.</p>
</div>
<script>
(() => {
  const list = document.getElementById("list"), empty = document.getElementById("empty");
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  function show(ladders) {
    list.replaceChildren();
    for (const l of ladders) {
      const li = document.createElement("li"), a = document.createElement("a");
      a.href = "/ladder/" + l.slug + "/";
      const left = document.createElement("div");
      const name = document.createElement("div"); name.className = "name"; name.textContent = l.name;
      const meta = document.createElement("div"); meta.className = "meta"; meta.textContent = plural(l.players, "player") + " · " + plural(l.games, "game");
      left.append(name, meta);
      const go = document.createElement("span"); go.className = "go"; go.textContent = "Open →";
      a.append(left, go); li.append(a); list.append(li);
    }
    list.hidden = !ladders.length;
    empty.hidden = !!ladders.length;
    if (!ladders.length) empty.textContent = "No ladders yet.";
  }
  try { const c = localStorage.getItem("ladder-list"); if (c) show(JSON.parse(c)); } catch (e) {}
  fetch("/ladder-api/_list").then(r => { if (!r.ok) throw 0; return r.json(); }).then(d => {
    show(d.ladders);
    try { localStorage.setItem("ladder-list", JSON.stringify(d.ladders)); } catch (e) {}
  }).catch(() => { if (list.hidden) empty.textContent = "Couldn't load the ladders. Check your connection and refresh."; });
})();
</script>
</body>
</html>
